name: snake

# The one thing here that is a third-party dependency, and it is an Action
# rather than a live service: it runs on this repo's own runner and commits the
# result to the output branch, so there is no request path to fall over.

# Manual only, and not currently used by the README. The snake animates this
# account's contribution graph, and the day-job commits live on a separate work
# account -- so it would animate an almost empty grid. Kept because it is ready
# to go the moment this account's graph is worth showing: run it from the
# Actions tab, then uncomment the block in README.md.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3.5.0
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

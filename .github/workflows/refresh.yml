name: refresh panels

# Everything the profile shows is drawn here and committed as static SVG, so a
# visitor loads plain files out of this repo. Nothing is rendered by a shared
# third-party service that can be rate-limited while a recruiter is looking.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/render.py"
      - "scripts/gh.py"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the panels
        # render.py is standard library only, so there is nothing to install.
        # GITHUB_TOKEN covers public contributions. To include private ones,
        # create a PAT with read:user, save it as secrets.METRICS_TOKEN, and
        # it is picked up ahead of the default token.
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/render.py

      - name: Commit if anything actually changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --quiet --staged; then
            echo "panels unchanged, nothing to commit"
          else
            git commit -m "refresh panels"
            git push
          fi
